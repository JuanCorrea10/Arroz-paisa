<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a81e17">
<meta name="color-scheme" content="light">

<!--
  La version. No es adorno: GitHub guarda cada archivo 10 minutos por su
  cuenta, asi que el navegador puede quedarse con el HTML nuevo y el CSS
  viejo. Cuando eso pasa la pagina se ve ROTA, no vieja, que es peor.

  Poniendole la version a la direccion, un archivo nuevo tiene direccion
  nueva y el navegador no tiene de donde sacar el viejo. Lo cambia solo el
  script de publicar; a mano no se toca.
-->
<meta name="version" content="20260909-1245">
<title>Arroz Paisa — Control de almuerzos</title>

<link rel="stylesheet" href="css/fuentes.css?v=20260909-1245">
<link rel="stylesheet" href="css/estilos.css?v=20260909-1245">
<link rel="stylesheet" href="css/pantallas.css?v=20260909-1245">

<!-- El logo del restaurante como icono de la pestaña. Es el mismo que hay
     en el aviso del local, asi que ella lo reconoce de una entre veinte
     pestañas abiertas. -->
<link rel="icon" type="image/jpeg" href="img/logo.jpg">
<link rel="apple-touch-icon" href="img/logo.jpg">

<!--
  Las tres librerías van aquí, en el HTML, y no dentro del JavaScript:
  así quedan disponibles como window.XLSX y window.jspdf para todo el mundo.
  Son copias guardadas en la carpeta vendor/ a propósito. Si las cargáramos de
  internet, el día que no haya internet la app dejaría de exportar.
-->
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

<a class="salto-al-contenido" href="#pantalla">Saltar al contenido</a>

<!--
  El header va en DOS pisos a proposito.

  Antes era uno solo y los 10 enlaces no cabian, asi que el mes y el estado se
  caian a una segunda linea y parecia un accidente. Partirlo de entrada se ve
  intencional y ademas separa dos cosas distintas: arriba DONDE estoy parado
  (que mes miro, si esta guardado) y abajo A DONDE puedo ir.
-->
<!-- Un centinela invisible. Mientras se vea, la pagina esta arriba del todo;
     cuando deja de verse, el header se encoge y saca sombra. Se usa esto y no
     un escuchador de scroll porque el scroll dispara cientos de veces por
     segundo y esto solo avisa cuando de verdad cambia algo. -->
<div id="tope-pagina" aria-hidden="true"></div>

<header class="barra">
  <div class="barra-piso barra-piso-alto">
    <!-- Sin el logo a proposito: a 34 px su texto interno es una mancha, y
         encima repite el nombre que esta al lado. Ese logo esta hecho para
         verse grande. Va en la cuenta de cobro, que es donde se ve grande y
         donde de verdad importa que el cliente lo reconozca. -->
    <div class="marca">Arroz Paisa <span>Ibagué</span></div>
    <div class="periodo" id="periodo"></div>
    <div class="guardado" id="guardado" data-estado="bien" role="status" aria-live="polite" title="Si esta verde, todo esta guardado">
      Abriendo…
    </div>
  </div>
  <div class="barra-piso barra-piso-bajo">
    <nav class="menu" id="menu" aria-label="Pantallas"></nav>
  </div>
</header>

<main class="hoja" id="pantalla" tabindex="-1">
  <p class="cargando">Abriendo sus datos…</p>
</main>

<!-- Los mensajitos de la esquina de abajo. -->
<div class="mensajes" id="mensajes" aria-live="polite"></div>

<noscript>
  <div class="hoja">
    <section class="tarjeta con-problemas">
      <h1>Hay que prender JavaScript</h1>
      <p>Esta app necesita JavaScript para funcionar. En Chrome está en
         Configuración → Privacidad y seguridad → Configuración de sitios → JavaScript.</p>
    </section>
  </div>
</noscript>

<!--
  El mapa de direcciones de los modulos.

  El <meta version> y el "?v=" del CSS ya evitaban que llegara el CSS viejo con
  el HTML nuevo. Pero de los 25 modulos de JavaScript solo app.js llevaba version
  en la direccion: los otros 24 se pedian siempre igual, asi que el navegador
  podia servirlos de lo que tenia guardado.

  Eso deja la app corriendo con HTML nuevo y JavaScript viejo, MEZCLADO. Y no
  se ve rota de una: se ve como si hiciera cosas raras "de la nada", sin que
  nada haya cambiado en el codigo. Es lo mas dificil de encontrar que hay,
  porque en el computador de uno nunca pasa.

  Poner el "?v=" a mano en cada import obligaria a tocar los 25 archivos en
  cada publicacion. Con este mapa lo traduce el navegador: el codigo sigue
  diciendo "./componentes.js" y se pide "./componentes.js?v=la-de-hoy".

  El mapa va ANTES del <script type="module">, que es como lo exige el
  navegador. Lo rehace publicar.ps1 leyendo la carpeta js/: a mano no se toca,
  y asi un archivo nuevo no se puede quedar por fuera.
-->
<!-- MAPA:INICIO --><script type="importmap">
{
  "imports": {
    "./js/app.js": "./js/app.js?v=20260909-1245",
    "./js/datos/almacen.js": "./js/datos/almacen.js?v=20260909-1245",
    "./js/datos/excel.js": "./js/datos/excel.js?v=20260909-1245",
    "./js/exportar/excel-export.js": "./js/exportar/excel-export.js?v=20260909-1245",
    "./js/exportar/pdf.js": "./js/exportar/pdf.js?v=20260909-1245",
    "./js/exportar/reporte-empresa.js": "./js/exportar/reporte-empresa.js?v=20260909-1245",
    "./js/nucleo/calculos.js": "./js/nucleo/calculos.js?v=20260909-1245",
    "./js/nucleo/formato.js": "./js/nucleo/formato.js?v=20260909-1245",
    "./js/nucleo/habitos.js": "./js/nucleo/habitos.js?v=20260909-1245",
    "./js/nucleo/importador.js": "./js/nucleo/importador.js?v=20260909-1245",
    "./js/nucleo/modelo.js": "./js/nucleo/modelo.js?v=20260909-1245",
    "./js/nucleo/nombres.js": "./js/nucleo/nombres.js?v=20260909-1245",
    "./js/nucleo/personal.js": "./js/nucleo/personal.js?v=20260909-1245",
    "./js/nucleo/sueltos.js": "./js/nucleo/sueltos.js?v=20260909-1245",
    "./js/ui/ayuda.js": "./js/ui/ayuda.js?v=20260909-1245",
    "./js/ui/cobro.js": "./js/ui/cobro.js?v=20260909-1245",
    "./js/ui/compartir.js": "./js/ui/compartir.js?v=20260909-1245",
    "./js/ui/componentes.js": "./js/ui/componentes.js?v=20260909-1245",
    "./js/ui/datos.js": "./js/ui/datos.js?v=20260909-1245",
    "./js/ui/errores.js": "./js/ui/errores.js?v=20260909-1245",
    "./js/ui/estado.js": "./js/ui/estado.js?v=20260909-1245",
    "./js/ui/informes.js": "./js/ui/informes.js?v=20260909-1245",
    "./js/ui/mantenimiento.js": "./js/ui/mantenimiento.js?v=20260909-1245",
    "./js/ui/nombres.js": "./js/ui/nombres.js?v=20260909-1245",
    "./js/ui/registrar.js": "./js/ui/registrar.js?v=20260909-1245"
  }
}
</script><!-- MAPA:FIN -->
<script type="module" src="js/app.js?v=20260909-1245"></script>

<script>
  // Si el navegador es muy viejo y no entiende módulos, el script de arriba ni
  // se ejecuta y la página se queda en "Abriendo…" para siempre. Esto lo
  // detecta y lo explica, en vez de dejarla mirando una pantalla pegada.
  window.addEventListener("load", function () {
    setTimeout(function () {
      var main = document.getElementById("pantalla");
      if (main && main.querySelector(".cargando")) {
        main.innerHTML =
          '<section class="tarjeta con-problemas">' +
          '<h1>No se pudo abrir</h1>' +
          '<p>Puede ser que el navegador esté muy viejo, o que el archivo se haya ' +
          'abierto con doble clic en vez de desde su dirección de internet.</p>' +
          '<p>Pruebe con Google Chrome o con Microsoft Edge.</p>' +
          '</section>';
      }
    }, 8000);
  });
</script>

</body>
</html>
