  let loQueSeTecleo = null;
  let loQueSeApago = null;

  if (forzar === "precio-disparejo" && datos.productos.length) {
    const plato = datos.productos.find((p) => p.nombre === "OFERTA") || datos.productos[0];
    const empresa = datos.empresas[2] || datos.empresas[0];
    datos.precios[`${plato.nombre}|${empresa.codigo}`] = 1000000;
  }
  // Una cuenta de cobro con los días escogidos a mano, y a propósito más
  // cortos que la quincena: así se ve el aviso de la plata que se queda por
  // fuera, que es el que no se puede probar con los datos tal como vienen.
  if (forzar === "rango-corto" && datos.empresas.length) {
    const { ponerRangoDeCobro } = await import("../js/nucleo/calculos.js");
    ponerRangoDeCobro(datos, datos.empresas[0].codigo, estado.anio, estado.mes, 1,
                      { desde: 5, hasta: 9 });
  }

  // Una cuenta que cubre TODO el anio. Es lo que pidio ella: una fabrica que
  // se atrasa medio anio y hay que pasarle una sola cuenta por todo. No se
  // puede probar con los datos tal como vienen porque ninguno pasa de un mes.
  if (forzar === "rango-anio" && datos.empresas.length) {
    const { ponerRangoDeCobro } = await import("../js/nucleo/calculos.js");
    ponerRangoDeCobro(datos, datos.empresas[0].codigo, estado.anio, estado.mes, 1,
                      { desde: `${estado.anio}-01-01`, hasta: `${estado.anio}-12-31` });
  }

  // Un rango que cruza el mes: del 20 de este mes al 5 del que sigue. Es donde
  // se ve si el papel dice los dos meses o se queda diciendo uno solo.
  if (forzar === "rango-cruzado" && datos.empresas.length) {
    const { ponerRangoDeCobro } = await import("../js/nucleo/calculos.js");
    const dos = (n) => String(n).padStart(2, "0");
    const otroMes = estado.mes === 12 ? 1 : estado.mes + 1;
    const otroAnio = estado.mes === 12 ? estado.anio + 1 : estado.anio;
    ponerRangoDeCobro(datos, datos.empresas[0].codigo, estado.anio, estado.mes, 1, {
      desde: `${estado.anio}-${dos(estado.mes)}-20`,
      hasta: `${otroAnio}-${dos(otroMes)}-05`,
    });
  }

  // Un plato que SI esta en el catalogo pero con renglones sin precio. En los
  // datos de verdad no hay ninguno, y es justo el caso que la tarjeta de
  // Revisar contaba al reves.
  if (forzar === "sin-precio") {
    const enCatalogo = new Set(datos.productos.map((x) => x.nombre));
    let tocados = 0;
    for (const c of datos.consumos) {
      if (tocados >= 3) break;
      if (!enCatalogo.has(c.producto) || !(c.precioUnitario > 0)) continue;
      if (c.producto !== "ALMUERZO") continue;
      c.precioUnitario = 0;
      c.revisar = ["SIN_PRECIO"];
      tocados++;
    }
  }

  // Algo "dejado asi", para ver la tarjeta que lo devuelve.
  if (forzar === "dejado") {
    const { platosSueltos, dejarComoEsta } = await import("../js/nucleo/sueltos.js");
    const primeros = platosSueltos(datos).slice(0, 2);
    for (const x of primeros) dejarComoEsta(datos, "PLATO", "", x.nombre);
  }

  // Las facturas de proveedores DE VERDAD, sacadas del Excel de ella.
  //
  // Van aqui y no en los datos de la app: sirven para MIRAR las pantallas
  // nuevas con la forma real de los datos -- proveedores escritos de dos
  // maneras, una fecha imposible, una factura sin valor, cantidades en
  // diecinueve formatos -- y no con tres filas inventadas que siempre salen
  // bien. Son datos de ella, asi que este archivo no se publica con nombres:
  // solo proveedores y productos, que no son personas.
  if (forzar.includes("compras")) {
    const { nuevaCompra } = await import("../js/nucleo/modelo.js");
    for (const c of FACTURAS_DE_PRUEBA) datos.compras.push(nuevaCompra(c));
    // Unas cuantas ya pagadas, para ver la pantalla con las dos columnas.
    for (let i = 0; i < datos.compras.length; i += 4) {
      datos.compras[i].pagadaEl = datos.compras[i].fecha;
    }
  }

  // Un dia con de-todo: alguien que pago de una, una cortesia y una nota.
  //
  // En los datos de verdad no hay NINGUNO: los 1135 renglones son todos a
  // credito y sin notas ese dia. O sea que las columnas de "a credito" y "de
  // contado", las marcas de cobro y las notas del pedido no se pueden mirar
  // nunca -- y son justo las que mas facil se dañan sin que nadie lo note.
  if (forzar.includes("raros")) {
    const delDia = datos.consumos.filter((c) => c.fecha === estado.fecha);
    if (delDia[0]) { delDia[0].cobro = "contado"; }
    if (delDia[1]) { delDia[1].cobro = "cortesia"; delDia[1].facturable = false; }
    if (delDia[2]) { delDia[2].observacion = "sin cebolla y bien caliente"; }
    if (delDia[3]) { delDia[3].observacion = "para llevar"; delDia[3].cobro = "contado"; }
  }

  // El propio restaurante como "empresa": su gente paga de una.
  //
  // No esta en los datos de verdad todavia, y es lo que hay que poder MIRAR:
  // que CASA salga en Cocina (hay que cocinarle) pero NO en la cuenta de cobro
  // ni en el resumen que se le manda a las fabricas.
  if (forzar.includes("casa")) {
    const { agregarEmpresa: agEmp, agregarPersona: agPer, nuevoConsumo: nuevoC } =
      await import("../js/nucleo/modelo.js");
    const { DE_CONTADO } = await import("../js/nucleo/calculos.js");
    agEmp(datos, { codigo: "CASA", razonSocial: "Arroz Paisa", esCasa: true });
    for (const quien of ["ROSA MEJIA", "LUIS TOBON", "MARTA ARIAS"]) {
      agPer(datos, { nombre: quien, empresa: "CASA" });
      datos.consumos.push(nuevoC({
        fecha: estado.fecha, empresa: "CASA", persona: quien,
        producto: "ALMUERZO", cantidad: 1, precioUnitario: 12000, cobro: DE_CONTADO,
      }));
    }
  }

  // Un plato APAGADO que sigue teniendo renglones. Es el caso que la confundio:
  // apago "JUGO EN LECHE" y siguio saliendo en las cuentas, en el resumen del
  // dia y en cuanto vendio, sin que nada dijera por que.
  if (forzar.includes("plato-apagado")) {
    const cual = datos.productos.find((p) =>
      datos.consumos.some((c) => c.producto === p.nombre));
    if (cual) { cual.activo = false; loQueSeApago = cual.nombre; }
  }

  // Un plato del catalogo con el nombre en blanco.
  //
  // Es lo que se sospecha que tiene ella: la lista de platos se arma SOLO al
  // elegir a la persona, asi que un plato dañado no molesta hasta ese momento
  // exacto -- y ahi tumba la pantalla entera, que es justo lo que describio.
  if (forzar.includes("plato-sin-nombre") && datos.productos.length) {
    datos.productos.push({ nombre: null, activo: true });
  }

  // ------------------------------------------------------------------------
  //  De aqui para arriba se TOCAN LOS DATOS, y por eso va antes de pintar.
  //
  //  Estaban abajo, despues del pintado, y dos funcionaban de casualidad: mas
  //  abajo otro paso escribia en un buscador, eso repintaba, y el cambio se
  //  alcanzaba a recoger. El tercero no tuvo esa suerte y la pagina salia como
  //  si el caso no existiera -- la prueba decia "todo bien" sin haber probado
  //  nada. Lo que toca datos, arriba; lo que toca la pantalla, abajo.
  // ------------------------------------------------------------------------


  const { formaDeCobro } = await import("../js/nucleo/calculos.js");

  const [ruta, fn] = PANTALLAS[cual] || PANTALLAS.catalogo;
  const modulo = await import(ruta);
  await modulo[fn](raiz);

  // Abrir el historial de la persona que más ha pedido: es la ventana más
  // larga que puede salir, y es donde se ve si se sale de la pantalla.
  if (forzar === "historial") {
    const nombres = raiz.querySelectorAll(".nombre-historial");
    let elMasLargo = null;
    let cuantos = 0;
    for (const boton of nombres) {
      const veces = datos.consumos.filter((c) => c.persona === boton.textContent).length;
      if (veces > cuantos) { cuantos = veces; elMasLargo = boton; }
    }
    if (elMasLargo) elMasLargo.click();
  }

  // Abrir la primera ventana de formulario que haya en la pantalla. Sirve para
  // mirar que una ventana corta se siga viendo bien: la ventana larga (la del
  // historial) obligo a ponerle tope de alto y barra a TODAS, y eso se puede
  // dañar sin que nadie lo note hasta que a ella no le cierra un formulario.
  // Escribir en el buscador como escribiria ella, letra por letra: asi se
  // prueba de verdad que el cursor no se pierda al repintar.
  if (forzar && forzar.startsWith("buscar:")) {
    const casilla = raiz.querySelector("#busca-persona");
    if (casilla) {
      // "buscar:oscar|pdf" teclea solo "oscar": el "|pdf" es una orden para
      // esta pagina, no algo que ella escribiria.
      const loQueEscribe = forzar.slice(7).replace(/\|pdf$/, "");
      casilla.focus();
      for (const letra of loQueEscribe) {
        casilla.value += letra;
        casilla.dispatchEvent(new Event("input", { bubbles: true }));
      }
      // Con "|pdf" al final, ademas se abre la ventana de bajar el PDF: ahi es
      // donde tiene que salir el aviso de que la lista va corta por la
      // busqueda, que es lo unico de esto que puede terminar mal.
      if (forzar.endsWith("|pdf")) {
        const bajar = [...document.querySelectorAll("button")]
          .find((b) => /bajar pdf/i.test(b.textContent));
        if (bajar) bajar.click();
      }
      const ahora = document.querySelector("#busca-persona");
      loQueSeTecleo =
        `#buscar "${loQueEscribe}"  ·  foco en ` +
        (document.activeElement === ahora ? "el buscador (BIEN)" : "otra cosa (MAL)") +
        `  ·  cursor en ${ahora ? ahora.selectionStart : "?"}`;
    }
  }

  // Dejar a la vista la tarjeta que interesa, que en una pantalla de 18 platos
  // queda muy abajo para la foto.
  if (forzar === "sin-precio") {
    const cual = [...raiz.querySelectorAll(".suelto-plato")]
      .find((t) => /ALMUERZO/.test(t.textContent));
    // Al rotulo y no con scrollIntoView: en Chrome sin ventana la foto sale
    // del tope de la pagina pase lo que pase, y esta tarjeta queda muy abajo.
    loQueSeTecleo = cual
      ? "TARJETA: " + cual.textContent.replace(/\s+/g, " ").trim().slice(0, 260)
      : "no se encontro la tarjeta de ALMUERZO";
  }

  if (forzar === "dejado") {
    const cual = [...raiz.querySelectorAll(".aviso-arreglable")]
      .find((t) => /Dejados as/.test(t.textContent));
    loQueSeTecleo = cual
      ? "TARJETA: " + cual.textContent.replace(/\s+/g, " ").trim().slice(0, 300)
      : "MAL: no salio la tarjeta de dejados asi";
  }

  // "&forzar=elegir-persona" hace lo que ella hace cada manana en Registrar:
  // escribir un nombre y elegirlo de la lista, para que salga el buscador de
  // platos. Es EL flujo de la app -- sin el no se puede anotar nada -- y hasta
  // ahora no se probaba de ninguna forma: se dano y nadie se entero hasta que
  // ella no pudo trabajar.
  //
  // El buscador de personas de Registrar no tiene id fijo (componentes.js le
  // pone uno al azar), asi que se busca por su etiqueta.
  if (forzar.includes("elegir-persona")) {
    const pasos = [];
    const etiqueta = [...raiz.querySelectorAll("label")]
      .find((l) => /Quien comio|Qui.n comi./i.test(l.textContent));
    const casilla = etiqueta ? raiz.querySelector("#" + CSS.escape(etiqueta.htmlFor)) : null;
    if (!casilla) {
      loQueSeTecleo = "MAL: no aparece el buscador de personas";
    } else {
      pasos.push("hay buscador de personas");
      casilla.focus();
      for (const letra of "a") {
        casilla.value += letra;
        casilla.dispatchEvent(new Event("input", { bubbles: true }));
      }
      const opciones = [...raiz.querySelectorAll('li[role="option"]')]
        .filter((li) => !li.classList.contains("crear"));
      pasos.push(opciones.length + " nombres en la lista");
      if (!opciones.length) {
        loQueSeTecleo = "MAL: " + pasos.join(" · ") + " · la lista salio vacia";
      } else {
        const quien = opciones[0].textContent.trim();
        opciones[0].click();
        await new Promise((r) => setTimeout(r, 60));
        const pidio = [...raiz.querySelectorAll("label")]
          .find((l) => /Que pidio|Qu. pidi./i.test(l.textContent));
        pasos.push(pidio
          ? 'salio "' + pidio.textContent.trim() + '"'
          : "MAL: NO salio el buscador de platos para " + quien);

        // Y anotarle un plato de verdad, para ver COMO nace el renglon.
        //
        // Importa por la casa: la gente del propio restaurante paga de una, y
        // si el renglon naciera "a credito" como los de las fabricas, esa
        // plata quedaria como deuda de nadie y no entraria a la caja. Eso no
        // se ve mirando la pantalla: hay que anotar y revisar el renglon.
        if (pidio) {
          const casillaPlato = raiz.querySelector("#" + CSS.escape(pidio.htmlFor));
          casillaPlato.focus();
          casillaPlato.value = "almuerzo";
          casillaPlato.dispatchEvent(new Event("input", { bubbles: true }));
          const platos = [...raiz.querySelectorAll('li[role="option"]')]
            .filter((li) => !li.classList.contains("crear"));
          if (!platos.length) {
            pasos.push("MAL: el buscador de platos no ofrece nada");
          } else {
            platos[0].click();
            await new Promise((r) => setTimeout(r, 80));
            const suyos = datos.consumos.filter(
              (c) => c.persona === quien && c.fecha === estado.fecha);
            const ultimo = suyos[suyos.length - 1];
            pasos.push(ultimo
              ? `renglon nuevo en ${ultimo.empresa}: se cobra "${formaDeCobro(ultimo)}"`
              : "MAL: no quedo anotado el plato");
          }
        }

        // "&forzar=elegir-persona+efectivo": marca "Pagó de una" para TODA la
        // persona y despues le anota otro plato.
        //
        // Es el caso que costaba plata: ella marcaba efectivo, agregaba la
        // gaseosa, y la gaseosa entraba a credito sin decir nada. A fin de
        // quincena se le cobraba a la empresa algo que la persona ya habia
        // pagado. Eso no se ve mirando la pantalla: hay que anotar y revisar
        // como quedo el renglon.
        if (pidio && forzar.includes("efectivo")) {
          const boton = [...raiz.querySelectorAll(".como-paga button")]
            .find((b) => /Pag./i.test(b.textContent));
          if (!boton) {
            pasos.push("MAL: no esta el control de como paga");
          } else {
            boton.click();
            await new Promise((r) => setTimeout(r, 80));

            const otra = [...raiz.querySelectorAll("label")]
              .find((l) => /Que pidio|Qu. pidi./i.test(l.textContent));
            const casilla2 = otra && raiz.querySelector("#" + CSS.escape(otra.htmlFor));
            if (casilla2) {
              casilla2.focus();
              casilla2.value = "coca";
              casilla2.dispatchEvent(new Event("input", { bubbles: true }));
              const ops = [...raiz.querySelectorAll('li[role="option"]')]
                .filter((li) => !li.classList.contains("crear"));
              if (ops.length) {
                ops[0].click();
                await new Promise((r) => setTimeout(r, 80));
              }
            }
            const suyos = datos.consumos.filter(
              (c) => c.persona === quien && c.fecha === estado.fecha);
            pasos.push("sus platos ahora: " +
              suyos.map((c) => c.producto + "=" + formaDeCobro(c)).join(", "));
          }
        }

        loQueSeTecleo = pasos.join(" · ");
      }
    }
  }

  // Dejar el plato apagado a la vista: en un catalogo de 77 platos queda muy
  // abajo, y lo que hay que mirar es el aviso que sale al lado del nombre.
  if (loQueSeApago) {
    const casilla = raiz.querySelector('input[type="search"]');
    if (casilla) {
      casilla.value = loQueSeApago;
      casilla.dispatchEvent(new Event("input", { bubbles: true }));
    }
    const fila = [...raiz.querySelectorAll("tr")]
      .find((t) => t.textContent.includes(loQueSeApago));
    loQueSeTecleo = fila
      ? "APAGADO: " + fila.textContent.replace(/\s+/g, " ").trim().slice(0, 280)
      : "MAL: no se encontro la fila de " + loQueSeApago;
  }

  // "&forzar=hasta:25" escribe el segundo dia del rango en Consumo por persona.
  if (forzar && forzar.startsWith("hasta:")) {
    const casilla = raiz.querySelector("#persona-hasta");
    if (casilla) {
      casilla.value = forzar.slice(6);
      casilla.dispatchEvent(new Event("change", { bubbles: true }));
    }
  }

  // "&forzar=solo:MGP" elige una sola empresa en el resumen del dia. Hace
  // falta porque esa eleccion vive dentro de informes.js y no se puede poner
  // por URL, y con UNA empresa la pantalla es distinta: no lleva la tabla del
  // dia completo, que seria el mismo numero escrito dos veces.
  if (forzar.startsWith("solo:")) {
    const sel = raiz.querySelector("#empresa-informe");
    if (sel) {
      sel.value = forzar.slice(5);
      sel.dispatchEvent(new Event("change", { bubbles: true }));
    }
  }

  // "&forzar=quincena:2" cambia la quincena en la cuenta de cobro. Hace falta
  // porque esa eleccion vive dentro de cobro.js y no se puede poner por URL.
  if (forzar && forzar.startsWith("quincena:")) {
    const sel = raiz.querySelector("#cobro-quincena");
    if (sel) {
      sel.value = forzar.slice(9);
      sel.dispatchEvent(new Event("change", { bubbles: true }));
    }
  }

  if (forzar === "ventana") {
    const abrir = [...raiz.querySelectorAll("button")]
      .find((b) => /editar|cambiar|agregar|póngale/i.test(b.textContent));
    if (abrir) abrir.click();
  }

  // Sin esto la foto sale mala: el buscador de personas se lleva el foco solo
  // -- que es lo correcto cuando ella la usa -- y despliega la lista de
  // nombres encima de media pantalla. Aquí la pantalla no se está usando: se
  // está retratando.
  //
  // Se insiste unas cuantas veces porque la pantalla pide el foco DESPUÉS de
  // pintarse, y una sola quitada se la gana la app. Además el buscador se
  // cierra 180 ms después de perder el foco, así que hay que darle ese tiempo.
  for (let i = 1; i <= 6; i++) {
    setTimeout(() => {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }, i * 150);
  }

  rotulo.textContent = loQueSeTecleo ||
    `#${cual}  ·  ${datos.consumos.length} renglones  ·  ${datos.personas.length} personas  ` +
    `·  ${datos.productos.length} platos  ·  ${estado.fecha}`;
} catch (error) {
  rotulo.textContent = "REVENTÓ: " + (error && (error.stack || error.message));
  rotulo.style.background = "#8b1a12";
}
</script>
</body>
</html>
