<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<title>Diagnóstico — Arroz Paisa</title>
<script src="../vendor/xlsx.full.min.js"></script>
<script src="../vendor/jspdf.umd.min.js"></script>
<script src="../vendor/jspdf.plugin.autotable.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; padding: 1.5rem; background: #e9efe6; }
  ul { list-style: none; padding: 0; }
  li { font-family: ui-monospace, Consolas, monospace; margin: .15rem 0; font-size: .9rem; }
  .ok { color: #23684a; } .mal { color: #a41e12; font-weight: 700; }
  .lento { color: #b47500; font-weight: 700; }
  pre { background: #fff; padding: .7rem; overflow-x: auto; font-size: .8rem; }
  iframe { width: 1200px; height: 700px; border: 1px solid #ccc; }
</style>
</head>
<body>
<h1>Diagnóstico de arranque</h1>
<p>
  Abre la app con los datos de verdad del Excel y recorre TODAS las pantallas,
  para ver si alguna se revienta o se pone lenta.
</p>
<ul id="pasos"></ul>
<pre id="detalle"></pre>

<script type="module">
const pasos = document.getElementById("pasos");
const detalle = document.getElementById("detalle");

function anotar(texto, estado = "ok") {
  const li = document.createElement("li");
  li.className = estado;
  const marca = { ok: "OK   ", mal: "MAL  ", lento: "LENTO" }[estado] || "     ";
  li.textContent = marca + " " + texto;
  pasos.append(li);
}

const esperar = (ms) => new Promise((listo) => setTimeout(listo, ms));

try {
  // ---- 1. Traer el Excel de verdad y meterlo en el navegador --------------
  const { hojasDesdeArchivo } = await import("../js/datos/excel.js");
  const { importar } = await import("../js/nucleo/importador.js");
  const almacen = await import("../js/datos/almacen.js");

  // La semilla: los datos con los que la app arranca la primera vez.
  const semilla = await almacen.semillaInicial();
  if (semilla) {
    const fechas = semilla.consumos.map((c) => c.fecha).filter(Boolean).sort();
    anotar(`semilla encontrada: ${semilla.consumos.length} renglones, ` +
           `del ${fechas[0]} al ${fechas[fechas.length - 1]}, ` +
           `${semilla.personas.length} personas, ${semilla.productos.length} platos`);
  } else {
    anotar("NO hay datos/inicial.json: la app va a abrir vacía", "lento");
  }

  // Y el Excel, para comparar que la semilla no se quedó vieja.
  const respuesta = await fetch("datos/PEDIDOS_AUTOMATIZADOS.xlsx");
  const bytes = new Uint8Array(await respuesta.arrayBuffer());
  const { datos, resumen } = importar(await hojasDesdeArchivo(bytes));
  anotar(`Excel leído: ${resumen.renglones} renglones, ${resumen.personas} personas, ` +
         `${resumen.productos} platos`);

  if (semilla && semilla.consumos.length !== resumen.renglones) {
    anotar(`la semilla tiene ${semilla.consumos.length} y el Excel ${resumen.renglones}: ` +
           "hay que volver a generarla con tests/generar-inicial.html", "mal");
  }

  // ---- 2. Medir las cuentas pesadas --------------------------------------
  const { gruposParaRevisar, nombresSucios } = await import("../js/nucleo/nombres.js");

  // Se mide sobre la SEMILLA, no sobre el Excel recién leído: la semilla es
  // lo que la app abre de verdad, y ya trae los documentos puestos. Medir
  // sobre el Excel daría un número que nadie va a ver nunca.
  const loQueVeElla = semilla || datos;

  let t0 = performance.now();
  const grupos = gruposParaRevisar(loQueVeElla);
  let ms = Math.round(performance.now() - t0);
  anotar(`gruposParaRevisar(): ${grupos.length} grupos en ${ms} ms`, ms > 1500 ? "lento" : "ok");

  t0 = performance.now();
  const sucios = nombresSucios(loQueVeElla);
  ms = Math.round(performance.now() - t0);
  anotar(`nombresSucios(): ${sucios.length} sucios en ${ms} ms`, ms > 500 ? "lento" : "ok");

  // Un vistazo a lo que encontró, que es lo que le va a salir a ella.
  for (const g of grupos.slice(0, 6)) {
    anotar(`   ${g.empresa}: ${g.integrantes.map((i) => i.nombre).join("  |  ")}  (${g.razon})`);
  }
  if (grupos.length > 6) anotar(`   ...y ${grupos.length - 6} grupos más`);

  // ---- 2.5 Qué va a encontrar la pantalla de Posibles errores ------------
  const { personasSueltas, platosSueltos } = await import("../js/nucleo/sueltos.js");
  const pers = personasSueltas(loQueVeElla);
  const plat = platosSueltos(loQueVeElla);
  anotar(`sueltos: ${pers.length} personas y ${plat.length} platos`);
  for (const p of pers) {
    const s = p.sugerencias[0];
    anotar(`   ${p.empresa} · ${p.nombre} (${p.renglones} rengl.) -> ` +
           (s ? `${s.nombre} — ${s.razon}` : "sin parecido"));
  }
  for (const p of plat.slice(0, 20)) {
    const s = p.sugerencias[0];
    anotar(`   ${p.nombre} (${p.renglones} rengl.) -> ` +
           (s ? `${s.nombre} — ${s.razon}${s.obvio ? "  [OBVIO]" : ""}` : "sin parecido"));
  }

  // ---- 3. Abrir la app entera y recorrer todas las pantallas --------------
  const marco = document.createElement("iframe");
  marco.src = "../index.html";
  document.body.append(marco);
  await new Promise((listo) => {
    marco.addEventListener("load", listo, { once: true });
    setTimeout(listo, 15000);
  });
  await esperar(3000);

  const doc = marco.contentDocument;
  const pantalla = () => doc.getElementById("pantalla");

  const menu = doc.getElementById("menu");
  anotar(`el menú tiene ${menu.children.length} enlaces`,
         menu.children.length === 10 ? "ok" : "mal");

  if (pantalla().querySelector(".cargando")) {
    anotar("la app se quedó pegada en 'Abriendo...'", "mal");
  }

  // Lo importante: ¿arrancó sola con los datos, sin que nadie importara nada?
  // Lo miramos por la pantalla de Datos, que muestra los totales en grande.
  marco.contentWindow.location.hash = "#datos";
  await esperar(700);
  const cifras = [...doc.querySelectorAll("#pantalla .cifra")]
    .map((c) => c.textContent.replace(/\s+/g, " ").trim());
  const renglones = cifras.find((c) => c.startsWith("Renglones guardados")) || "";
  const cuantos = Number((renglones.match(/(\d[\d.]*)\s*$/) || [])[1]?.replace(/[.]/g, "") || 0);
  anotar(`la app arrancó sola con ${cuantos} renglones`, cuantos > 0 ? "ok" : "mal");

  // Todas las pantallas, incluidas las que viven dentro de Ajustes.
  const TODAS = [
    "#registrar", "#cocina", "#resumen", "#persona", "#cobro", "#cuadre",
    "#compartir", "#revisar", "#ajustes", "#personas", "#nombres", "#catalogo",
    "#empresas", "#datos", "#ayuda",
  ];

  for (const destino of TODAS) {
    const inicio = performance.now();
    marco.contentWindow.location.hash = destino;
    await esperar(150);
    // Esperamos a que aparezca un h1, hasta 6 segundos.
    let intentos = 0;
    while (!pantalla().querySelector("h1") && intentos < 60) {
      await esperar(100);
      intentos++;
    }
    const tardo = Math.round(performance.now() - inicio);

    const roto = !!pantalla().querySelector(".con-problemas h1");
    const h1 = pantalla().querySelector("h1");
    const filas = pantalla().querySelectorAll("tbody tr").length;

    const estado = roto ? "mal" : (tardo > 2500 ? "lento" : "ok");
    anotar(`${destino.padEnd(11)} ${String(tardo).padStart(5)} ms  ` +
           `${filas ? String(filas).padStart(4) + " filas  " : "          "}` +
           (roto ? "SE REVENTÓ" : (h1 ? h1.textContent : "sin título")), estado);

    if (roto && !detalle.textContent) {
      detalle.textContent = destino + "\n\n" +
        (pantalla().querySelector("pre")?.textContent || "(sin detalle)");
    }
  }

  marco.remove();
  anotar("recorrido terminado");
} catch (error) {
  anotar(String(error && error.message || error), "mal");
  detalle.textContent = String(error && error.stack || error);
}

// Le mandamos el resultado al servidor para poder revisarlo sin mirar la
// pantalla. Si el servidor no está, se ve aquí y ya.
try {
  await fetch("/diagnostico", {
    method: "POST",
    body: [...pasos.children].map((li) => li.textContent).join("\n") +
          (detalle.textContent ? "\n\nDETALLE:\n" + detalle.textContent : ""),
  });
} catch { /* sin servidor no pasa nada */ }
</script>
</body>
</html>
